services:
  postgres:
    image: postgres:16-alpine
    container_name: opsmcp-postgres
    environment:
      POSTGRES_USER: opsmcp
      POSTGRES_PASSWORD: opsmcp
      POSTGRES_DB: opsmcp
    ports:
      - "5432:5432"
    volumes:
      - ./scripts/seed_postgres.sql:/docker-entrypoint-initdb.d/01_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opsmcp -d opsmcp"]
      interval: 3s
      timeout: 3s
      retries: 10
