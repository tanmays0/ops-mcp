name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: opsmcp
          POSTGRES_PASSWORD: opsmcp
          POSTGRES_DB: opsmcp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opsmcp -d opsmcp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Seed Postgres
        env:
          PGPASSWORD: opsmcp
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          until pg_isready -h localhost -U opsmcp -d opsmcp; do sleep 1; done
          psql -h localhost -U opsmcp -d opsmcp -f scripts/seed_postgres.sql

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Pytest
        env:
          OPS_MCP_DATABASE_URL: postgresql://opsmcp:opsmcp@localhost:5432/opsmcp
          OPS_MCP_FS_ROOTS: ${{ github.workspace }}/fixtures/fs_sandbox
        run: uv run pytest -q
